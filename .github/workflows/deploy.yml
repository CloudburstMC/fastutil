on:
  workflow_call:
    inputs:
      deploy-url:
        description: 'The maven repository to deploy to'
        required: true
        type: string
    secrets:
      DEPLOY_USERNAME:
        required: true
      DEPLOY_PASSWORD:
        required: true
      PGP_SECRET:
        required: true
      PGP_PASSPHRASE:
        required: true

env:
  GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.welcome=never"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Generate sources
        run: make sources
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: ./gradlew publish
        env:
          MAVEN_DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          MAVEN_DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          MAVEN_DEPLOY_URL: ${{ inputs.deploy-url }}
